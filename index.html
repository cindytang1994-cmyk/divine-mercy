<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>慈悲串經互動朗讀版 · 單屏版</title>
    <style>
        :root { --p-gold: #d4af37; --bg: #121212; --panel: #1e1e1e; --txt: #f0f0f0; --glow: rgba(212, 175, 55, 0.8); }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; height:100%; overflow:hidden; }
        body {
            background: var(--bg);
            color: var(--txt);
            font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-image: radial-gradient(circle at 70% 40%, #1a1a1a 0%, #121212 70%);
        }
        .app {
            display: grid;
            grid-template-columns: minmax(220px, 3fr) minmax(320px, 7fr);
            gap: 16px;
            height: 100dvh;
            max-height: 100dvh;
            padding: 32px 18px;
            overflow: hidden;
        }
        .left-pane {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            min-height: 0;
            height: 100%;
            overflow: hidden;
        }
        header { flex: 0 0 auto; }
        h1 {
            margin: 0;
            color: var(--p-gold);
            font-size: clamp(1.15rem, 2.2vw, 1.7rem);
            line-height: 1.25;
            letter-spacing: 0.02em;
        }
        .controls { display:flex; flex-wrap:wrap; gap:10px; flex: 0 0 auto; }
        button {
            background: var(--p-gold);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:disabled { background:#555; color:#888; cursor:not-allowed; }
        .voice-settings {
            flex: 0 0 auto;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }
        .voice-row {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .voice-settings label { white-space: nowrap; flex: 0 0 auto; }
        select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 8px;
            border-radius: 5px;
            max-width: 100%;
            min-width: 0;
            flex: 1;
        }
        #display-panel {
            background: var(--panel);
            border-radius: 14px;
            padding: 12px 14px;
            flex: 0 1 auto;
            max-height: 70%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            text-align: center;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,0.18);
        }
        #prayer-title {
            color: var(--p-gold);
            font-size: clamp(1rem, 1.8vw, 1.35rem);
            margin: 0 0 8px 0;
            flex: 0 0 auto;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }
        #prayer-text {
            font-size: clamp(0.92rem, 1.5vw, 1.15rem);
            line-height: 1.55;
            margin: 0;
            white-space: pre-line;
            overflow: hidden;
            max-height: calc(1.55em * 5);
            flex: 0 1 auto;
            min-height: 0;
            text-align: left;
        }
        .right-pane {
            min-width: 0;
            min-height: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .rosary-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .rosary-layout-container {
            position: relative;
            width: 480px;
            height: 680px;
            flex: 0 0 auto;
            transform-origin: center center;
        }
        .rosary-line {
            position: absolute;
            left: 240px;
            width: 2px;
            background: linear-gradient(to bottom, var(--p-gold), #b89b4d);
            transform: translateX(-50%);
            z-index: 4;
            pointer-events: none;
            opacity: 0.9;
            box-shadow: 0 0 4px rgba(212,175,55,0.4);
        }
        .divine-mercy-img {
            position: absolute;
            left: 50%;
            top: 210px;
            transform: translate(-50%, -50%);
            width: 125px;
            height: 185px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(212,175,55,0.25), 0 4px 15px rgba(0,0,0,0.8);
            border: 1px solid rgba(212,175,55,0.4);
            z-index: 1;
            pointer-events: none;
            background: #16161c;
        }
        .bead {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #444;
            border: 2px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
            transform: translate(-50%, -50%);
            z-index: 6;
        }
        .bead.cross { width:78px; height:78px; border-radius:12px; background:#5a4a3a; border-color:#8b7355; color:#e6c280; font-size:2.6rem; z-index:10; }
        .bead.blue-style { background:#2a4d69; border-color:#4b86b4; color:#adcbe3; font-size:0rem; }
        .bead.large-blue { width:36px; height:36px; }
        .bead.earlier-small-blue { width:16px; height:16px; }
        .bead.active { background:var(--p-gold)!important; border-color:#fff!important; color:#000!important; font-size:0.65rem; animation:pulse 0.8s infinite alternate; z-index:12; }
        @keyframes pulse {
            0% { transform:translate(-50%, -50%) scale(1); box-shadow:0 0 8px var(--glow); }
            100% { transform:translate(-50%, -50%) scale(1.3); box-shadow:0 0 25px var(--glow), 0 0 35px var(--p-gold); }
        }
        @media (max-width: 820px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
                gap: 8px;
                padding: 10px 12px 12px;
            }
            .left-pane { gap: 6px; height: auto; overflow: visible; }
            #display-panel {
                padding: 8px 10px;
                max-height: none;
                flex: 0 0 auto;
            }
            #prayer-text { max-height: calc(1.55em * 3); }
            h1 { font-size: 1.05rem; text-align: center; }
            .controls {
                width: 100%;
                flex-wrap: nowrap;
                gap: 8px;
            }
            .controls button {
                flex: 1 1 0;
                min-width: 0;
                padding: 8px 6px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="left-pane">
        <header><h1>慈悲串經互動朗讀版 · 單屏版</h1></header>
        <div class="controls">
            <button id="start-btn">開始誦念</button>
            <button id="pause-btn" disabled>暫停</button>
            <button id="reset-btn">重設</button>
        </div>
        <div class="voice-settings">
            <div class="voice-row">
                <label for="lang-select">語言：</label>
                <select id="lang-select">
                    <option value="yue">廣東話</option>
                    <option value="zh-TW">國語（台灣）</option>
                    <option value="zh-CN">普通話（大陸）</option>
                    <option value="zh-other">其他中文</option>
                </select>
            </div>
            <div class="voice-row">
                <label for="voice-select">語音：</label>
                <select id="voice-select"><option value="">載入中…</option></select>
            </div>
        </div>
        <div id="display-panel">
            <h2 id="prayer-title">點擊「開始誦念」啟動全自動連續語音功能</h2>
            <p id="prayer-text">本系統支援中文語音朗誦（廣東話／國語／普通話），念珠會隨語音進度同步跳動發光。可在上方切換語言與語音。</p>
        </div>
    </aside>
    <section class="right-pane">
        <div class="rosary-stage" id="rosary-stage">
            <div class="rosary-layout-container" id="beads-container">
                <img class="divine-mercy-img" src="assets/jesus.JPG?v=20260809b" alt="Divine Mercy">
            </div>
        </div>
    </section>
</div>
<script>
const P = {
    s:{t:"因父、及子、及聖神之名",x:"因父、及子、及聖神之名。亞孟。"},
    p:{t:"天主經",x:"我們的天父，願祢的名受顯揚；願祢的國來臨；願祢的旨意奉行在人間，如同在天上。求祢今天賞給我們日用的食糧；求祢寬恕我們的罪過，如同我們寬恕別人一樣；不要讓我們陷於誘惑；但救我們免於凶惡。亞孟。"},
    m:{t:"聖母經",x:"萬福瑪利亞，妳充滿聖寵。主與妳同在。妳在婦女中受讚頌，妳的親子耶穌同受讚頌。天主聖母瑪利亞，求妳現在和我們臨終時，為我們罪人祈求天主。亞孟。"},
    c:{t:"信經",x:"我信全能的天主父，天地萬物的創造者。我信父的唯一子，我們的主耶穌基督。祂因聖神降孕，由童貞瑪利亞誕生。祂在比拉多執政時蒙難，被釘在十字架上，死而安葬。祂下降陰府，第三日自死者中復活。祂升了天，坐在全能天主父的右邊。祂要從天降來，審判生者死者。我信聖神。我信聖而公教會，諸聖的相通。罪過的赦免。肉身的復活。永恆的生命。亞孟。"},
    e:{t:"永生之父",x:"永生之父，我把您至愛之子，我們的主耶穌基督的聖體、聖血、靈魂及天主性奉獻給您，以賠補我們及普世的罪過。"},
    h:{t:"因祂的至悲慘苦難",x:"因祂的至悲慘苦難，求您垂憐我們及普世。"},
    g:{t:"至聖天主 (結尾三遍)",x:"至聖天主，至聖強有力者，致聖長存者，求您垂憐我們及普世。"},
    o:{t:"主耶穌，慈悲的君王，我們信賴祢！",x:"主耶穌，慈悲的君王，我們信賴祢！\n\n因父、及子及聖神之名。亞孟。"}
};

// 重新架構核心排序陣列，確保第1粒大珠處於垂直線頂端與圓環底部交會處
const seq = [];
seq.push({id:0,type:"cross",title:P.s.t,text:P.s.x,label:"†"});
seq.push({id:1,type:"blue-style earlier-small-blue",title:P.p.t,text:P.p.x,label:""});
seq.push({id:2,type:"blue-style earlier-small-blue",title:P.m.t,text:P.m.x,label:""});
seq.push({id:3,type:"blue-style earlier-small-blue",title:P.c.t,text:P.c.x,label:""});
seq.push({id:4,type:"blue-style large-blue",title:`第 1 端 · `+P.e.t,text:`(第 1 端)\n`+P.e.x,label:""});

// 第1端的10粒小珠
for(let b=0;b<10;b++) seq.push({id:seq.length,type:"small",title:P.h.t,text:`(${b+1}/10)\n`+P.h.x,label:(b+1).toString()});
// 其餘4端循環
for(let d=1;d<5;d++){
    seq.push({id:seq.length,type:"blue-style large-blue",title:`第 ${d+1} 端 · `+P.e.t,text:`(第 ${d+1} 端)\n`+P.e.x,label:""});
    for(let b=0;b<10;b++) seq.push({id:seq.length,type:"small",title:P.h.t,text:`(${b+1}/10)\n`+P.h.x,label:(b+1).toString()});
}
let closingPrayers = [{title:P.g.t, text:"(第 1 遍)\n" + P.g.x},{title:P.g.t, text:"(第 2 遍)\n" + P.g.x},{title:P.g.t, text:"(第 3 遍)\n" + P.g.x},{title:P.o.t, text:P.o.x}];
let idx=-1, playing=false, synth=window.speechSynthesis, utter=null, closingIdx=0;
const startBtn=document.getElementById('start-btn'), pauseBtn=document.getElementById('pause-btn'), resetBtn=document.getElementById('reset-btn');
const tDisp=document.getElementById('prayer-title'), xDisp=document.getElementById('prayer-text'), box=document.getElementById('beads-container');
const lSel=document.getElementById('lang-select'), vSel=document.getElementById('voice-select');
const stage=document.getElementById('rosary-stage');
const LANG_PREF_KEY='pray-lang', VOICE_PREF_KEY='pray-voice';
const LANG_ORDER=['yue','zh-TW','zh-CN','zh-other'];
const LANG_LABELS={yue:'廣東話','zh-TW':'國語（台灣）','zh-CN':'普通話（大陸）','zh-other':'其他中文'};
function fitRosary(){
    if (!stage || !box) return;
    const pad = 16; // keep ring edge and cross inside the stage
    const sw = stage.clientWidth - pad * 2;
    const sh = stage.clientHeight - pad * 2;
    if (sw <= 0 || sh <= 0) return;
    // Scale up or down so the ring nearly fills the right pane
    const layoutW = 480, layoutH = 680;
    const scale = Math.min(sw / layoutW, sh / layoutH);
    box.style.transform = `scale(${scale})`;
    // transform does not change layout box — compensate so the page never scrolls
    const dx = (layoutW * scale - layoutW) / 2;
    const dy = (layoutH * scale - layoutH) / 2;
    box.style.margin = `${dy}px ${dx}px`;
}
function showPrayer(title, text){
    tDisp.innerText = title;
    xDisp.innerText = text;
}
function render(){
    const centerX = 240, centerY = 245;
    const ringRadiusX = 205, ringRadiusY = 165, ringSqueeze = 0.22;
    // 環底大藍珠固定；垂直鏈珠等距，黃線等長並接到每顆藍珠邊緣
    // centerY kept high enough so the squeezed ring top stays inside the layout
    const largeBlueY = centerY + ringRadiusY * (1 - ringSqueeze);
    const crossY = 622;
    const rLarge = 18, rSmall = 8, rCross = 39;
    const radiiBetween = [
        rLarge + rSmall, // 大藍珠 → 信經珠
        rSmall + rSmall, // 信經 → 聖母經
        rSmall + rSmall, // 聖母經 → 天主經
        rSmall + rCross  // 天主經 → 十字架
    ];
    const totalSpan = crossY - largeBlueY;
    const lineLen = (totalSpan - radiiBetween.reduce((a, b) => a + b, 0)) / radiiBetween.length;
    const credoY = largeBlueY + rLarge + lineLen + rSmall;
    const aveY = credoY + rSmall + lineLen + rSmall;
    const paterY = aveY + rSmall + lineLen + rSmall;
    const stemYs = [crossY, paterY, aveY, credoY, largeBlueY];

    box.innerHTML = `<img class="divine-mercy-img" src="assets/jesus.JPG?v=20260809b" alt="Divine Mercy">`;

    // 四段等長黃線：藍珠↔藍珠↔藍珠↔大藍珠，以及最下段接到十字架
    const stemRadii = [rCross, rSmall, rSmall, rSmall, rLarge];
    for (let s = 0; s < stemYs.length - 1; s++) {
        const topEdge = stemYs[s + 1] + stemRadii[s + 1];
        const line = document.createElement('div');
        line.className = 'rosary-line';
        line.style.top = `${topEdge}px`;
        line.style.height = `${lineLen}px`;
        box.appendChild(line);
    }

    seq.forEach((b,i)=>{
        const el=document.createElement('div'); el.className=`bead ${b.type}`; el.innerHTML=b.label; let posX = centerX, posY = crossY;
        if(i === 0) { posX = centerX; posY = crossY; }
        else if(i === 1) { posX = centerX; posY = paterY; }
        else if(i === 2) { posX = centerX; posY = aveY; }
        else if(i === 3) { posX = centerX; posY = credoY; }
        else {
            // 從第 1 粒大珠起全部加入橢圓環；大珠落在環底正中，與垂直鏈相接
            const ringIndex = i - 4;
            const totalRingBeads = seq.length - 4;
            const angle = (ringIndex / totalRingBeads) * 2 * Math.PI + Math.PI / 2;
            const radiusX = ringRadiusX * Math.cos(angle);
            const radiusY = ringRadiusY * Math.sin(angle) * (1 - ringSqueeze * Math.sin(angle));
            posX = centerX + radiusX;
            posY = centerY + radiusY;
        }
        el.style.left = `${posX}px`; el.style.top = `${posY}px`; el.onclick=()=>{ beginReadingFrom(i); }; box.appendChild(el);
    });
    fitRosary();
}
function update(){ document.querySelectorAll('.bead').forEach((b,i)=>{ if(i===idx){ b.classList.add('active'); }else b.className=`bead ${seq[i].type}`; }); }
render();
window.addEventListener('resize', fitRosary);
function classifyVoiceLang(v) {
    const lang = (v.lang || '').toLowerCase().replace(/_/g, '-');
    const name = (v.name || '').toLowerCase();
    const isYue = lang.includes('zh-hk') || lang.includes('yue') || name.includes('cantonese') || name.includes('hong kong') || name.includes('粵語') || name.includes('廣東') || name.includes('sinji');
    if (isYue) return 'yue';
    if (lang.startsWith('zh-tw') || name.includes('taiwan') || name.includes('meijia') || name.includes('美佳')) return 'zh-TW';
    if (lang.startsWith('zh-cn') || lang === 'zh' || name.includes('chinese (china)') || name.includes('tingting') || name.includes('ting-ting') || name.includes('丽娜') || name.includes('婷婷')) return 'zh-CN';
    if (lang.startsWith('zh') || name.includes('chinese') || name.includes('mandarin') || name.includes('中文') || name.includes('國語') || name.includes('普通话') || name.includes('普通話')) return 'zh-other';
    return null;
}
function scoreVoice(v, langKey) {
    const name = v.name || '';
    let score = 0;
    if (name.includes('Google')) score += 30;
    if (name.includes('Enhanced') || name.includes('Premium') || name.includes('Neural')) score += 20;
    if (langKey === 'yue' && (name.includes('Sinji') || name.includes('粵語'))) score += 10;
    if (v.localService) score += 5;
    return score;
}
function voicesForLang(langKey) {
    try {
        return synth.getVoices().filter(v => classifyVoiceLang(v) === langKey)
            .sort((a, b) => scoreVoice(b, langKey) - scoreVoice(a, langKey) || a.name.localeCompare(b.name));
    } catch (e) { return []; }
}
function getAssignedVoice() {
    try {
        const voices = synth.getVoices();
        const selected = voices.find(x => x.name === vSel.value);
        if (selected) return selected;
        const list = voicesForLang(lSel.value);
        return list[0] || voices.find(v => classifyVoiceLang(v)) || null;
    } catch (e) { return null; }
}
function loadV() {
    try {
        const voices = synth.getVoices();
        if (!voices || voices.length === 0) return;

        const available = LANG_ORDER.filter(k => voicesForLang(k).length > 0);
        if (available.length === 0) {
            vSel.innerHTML = '<option value="">此裝置未找到中文語音</option>';
            return;
        }

        const savedLang = localStorage.getItem(LANG_PREF_KEY);
        const prevLang = lSel.value;
        const langPick = available.includes(savedLang) ? savedLang
            : (available.includes(prevLang) ? prevLang : available[0]);

        lSel.innerHTML = '';
        available.forEach(k => {
            const o = document.createElement('option');
            o.value = k;
            o.textContent = LANG_LABELS[k];
            lSel.appendChild(o);
        });
        lSel.value = langPick;

        const list = voicesForLang(langPick);
        const savedVoice = localStorage.getItem(VOICE_PREF_KEY);
        const prevVoice = vSel.value;
        vSel.innerHTML = '';
        list.forEach(x => {
            const o = document.createElement('option');
            o.value = x.name;
            o.textContent = x.name;
            vSel.appendChild(o);
        });
        const keep = list.find(x => x.name === prevVoice) || list.find(x => x.name === savedVoice);
        vSel.value = keep ? keep.name : list[0].name;

        localStorage.setItem(LANG_PREF_KEY, lSel.value);
        localStorage.setItem(VOICE_PREF_KEY, vSel.value);
    } catch (e) {}
}
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadV;
setTimeout(loadV, 300); setTimeout(loadV, 800);
function isAppleChineseVoice(voiceObj) {
    const name = voiceObj ? (voiceObj.name || '') : '';
    if (name.includes('Sinji') || name.includes('Meijia') || name.includes('Tingting') || name.includes('Ting-Ting') || name.includes('Apple')) return true;
    return !name && /iPhone|iPad|Macintosh/i.test(navigator.userAgent);
}
function optimizeTextForVoice(rawText, voiceObj) {
    let clean = rawText.replace(/\(\d+\/\d+\)/g, '').replace(/\(第\s*\d+\s*[端遍]\)/g, '');
    const voiceName = voiceObj ? voiceObj.name : '';
    const langKey = classifyVoiceLang(voiceObj) || lSel.value;
    clean = clean.replace(/妳的/g, '祢的').replace(/妳/g, '祢');
    if (voiceName.includes('Google') || vSel.value.includes('Google')) {
        if (langKey === 'yue') {
            clean = clean.replace(/聖神/g, '聖臣').replace(/垂憐/g, '誰憐').replace(/及普世/g, '同普世');
        }
    } else if (langKey === 'yue' && isAppleChineseVoice(voiceObj)) {
        clean = clean.replace(/亞孟/g, '呀免');
    }
    return clean;
}
function speakWithAssignedVoice(text, onDone) {
    loadV();
    const v = getAssignedVoice();
    const optimizedText = optimizeTextForVoice(text, v);
    utter = new SpeechSynthesisUtterance(optimizedText);
    const langFallback = { yue: 'zh-HK', 'zh-TW': 'zh-TW', 'zh-CN': 'zh-CN', 'zh-other': 'zh-TW' };
    utter.lang = (v && v.lang) ? v.lang : (langFallback[lSel.value] || 'zh-HK');
    if (v) utter.voice = v;
    utter.rate = 0.85;
    utter.onend = () => { if (playing) onDone(); };
    utter.onerror = (e) => {
        if (!playing) return;
        if (e.error === 'interrupted' || e.error === 'canceled') return;
        setTimeout(() => { if (playing) onDone(); }, 400);
    };
    // Chrome can drop speak() if called in the same turn as cancel()
    setTimeout(() => { if (playing) synth.speak(utter); }, 40);
}
function speak(){
    if (!playing || idx < 0) return;
    if (idx >= seq.length) { speakClosingSequence(); return; }
    synth.cancel();
    const b = seq[idx];
    showPrayer(b.title, b.text);
    update();
    speakWithAssignedVoice(b.text, () => { idx++; setTimeout(speak, 150); });
}
function speakClosingSequence() {
    if (!playing) return;
    if (closingIdx >= closingPrayers.length) { endRosary(); return; }
    synth.cancel();
    const cp = closingPrayers[closingIdx];
    showPrayer(cp.title, cp.text);
    document.querySelectorAll('.bead').forEach(b => b.classList.remove('active'));
    speakWithAssignedVoice(cp.text, () => { closingIdx++; setTimeout(speakClosingSequence, 150); });
}
function endRosary() { playing=false; startBtn.disabled=false; pauseBtn.disabled=true; startBtn.innerText="重新開始"; closingIdx=0; }
function jump(i){ idx=i; const b=seq[idx]; showPrayer(b.title, b.text); update(); }
function beginReadingFrom(i){
    synth.cancel();
    closingIdx = 0;
    jump(i);
    playing = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    pauseBtn.innerText = "暫停";
    speak();
}
startBtn.onclick=()=>{ if(!playing){ beginReadingFrom(idx===-1||idx>=seq.length ? 0 : idx); } };
pauseBtn.onclick=()=>{ if(playing){ playing=false; synth.cancel(); pauseBtn.innerText="繼續"; } else { playing=true; pauseBtn.innerText="暫停"; if(idx>=seq.length){ speakClosingSequence(); } else { speak(); } } };
resetBtn.onclick=()=>{ playing=false; synth.cancel(); idx=-1; closingIdx=0; startBtn.disabled=false; pauseBtn.disabled=true; startBtn.innerText="開始誦念"; pauseBtn.innerText="暫停"; showPrayer("點擊「開始誦念」啟動全自動連續語音功能", "本系統支援中文語音朗誦（廣東話／國語／普通話），念珠會隨語音進度同步跳動發光。可在上方切換語言與語音。"); document.querySelectorAll('.bead').forEach(b=>{ b.className=`bead ${seq[b.id].type}`; }); };
function persistVoiceChoice() {
    try {
        localStorage.setItem(LANG_PREF_KEY, lSel.value);
        localStorage.setItem(VOICE_PREF_KEY, vSel.value);
    } catch (e) {}
}
lSel.onchange=()=>{
    localStorage.setItem(LANG_PREF_KEY, lSel.value);
    localStorage.removeItem(VOICE_PREF_KEY);
    loadV();
    if (playing) { synth.cancel(); speak(); }
};
vSel.onchange=()=>{
    persistVoiceChoice();
    if (playing) { synth.cancel(); speak(); }
};
</script>
