<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>慈悲串經</title>
    <style>
        :root { --p-gold: #d4af37; --bg: #121212; --panel: #1e1e1e; --txt: #f0f0f0; --glow: rgba(212, 175, 55, 0.8); }
        * { box-sizing: border-box; }
        html, body { margin:0; padding:0; height:100%; overflow:hidden; }
        body {
            background: var(--bg);
            color: var(--txt);
            font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-image: radial-gradient(circle at 70% 40%, #1a1a1a 0%, #121212 70%);
        }
        body.lang-zh-Hans {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body.lang-en {
            font-family: "Source Sans 3", "Segoe UI", "Helvetica Neue", sans-serif;
        }
        .app {
            display: grid;
            grid-template-columns: minmax(220px, 3fr) minmax(320px, 7fr);
            gap: 16px;
            height: 100dvh;
            max-height: 100dvh;
            padding: 32px 18px;
            overflow: hidden;
        }
        .left-pane {
            display: flex;
            flex-direction: column;
            gap: 28px;
            min-width: 0;
            min-height: 0;
            height: 100%;
            overflow: hidden;
        }
        header { flex: 0 0 auto; padding-top: 28px; }
        h1 {
            margin: 0;
            color: var(--p-gold);
            font-size: clamp(1.15rem, 2.2vw, 1.7rem);
            line-height: 1.25;
            letter-spacing: 0.02em;
        }
        .controls { display:flex; flex-wrap:wrap; gap:10px; flex: 0 0 auto; }
        button {
            background: var(--p-gold);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:disabled { background:#555; color:#888; cursor:not-allowed; }
        .voice-settings {
            flex: 0 0 auto;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }
        .voice-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            min-width: 0;
        }
        .voice-settings label { white-space: nowrap; flex: 0 0 auto; }
        select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 5px 8px;
            border-radius: 5px;
            max-width: 100%;
            min-width: 0;
            flex: 1;
        }
        #lang-select { flex: 1 1 auto; min-width: 0; }
        #speed-select { flex: 0 1 auto; width: auto; max-width: 9.5rem; }
        #display-panel {
            position: relative;
            background: var(--panel);
            border-radius: 14px;
            padding: 12px 14px;
            flex: 0 1 auto;
            max-height: 78%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            text-align: center;
            overflow: hidden;
            border: 1px solid rgba(212,175,55,0.18);
        }
        #prayer-progress {
            position: absolute;
            top: 8px;
            left: 10px;
            z-index: 1;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
            color: rgba(212, 175, 55, 0.85);
            line-height: 1;
            pointer-events: none;
        }
        #prayer-progress:empty { display: none; }
        #prayer-title {
            color: var(--p-gold);
            font-size: clamp(1rem, 1.8vw, 1.35rem);
            margin: 0 0 8px 0;
            padding: 0 2.6rem;
            flex: 0 0 auto;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }
        #prayer-text {
            font-size: clamp(0.92rem, 1.5vw, 1.15rem);
            line-height: 1.55;
            margin: 0;
            white-space: pre-line;
            overflow: hidden;
            flex: 1 1 auto;
            min-height: 0;
            text-align: left;
        }
        .right-pane {
            min-width: 0;
            min-height: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .rosary-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .rosary-layout-container {
            position: relative;
            width: 480px;
            height: 680px;
            flex: 0 0 auto;
            transform-origin: center center;
        }
        .rosary-line {
            position: absolute;
            left: 240px;
            width: 2px;
            background: linear-gradient(to bottom, var(--p-gold), #b89b4d);
            transform: translateX(-50%);
            z-index: 4;
            pointer-events: none;
            opacity: 0.9;
            box-shadow: 0 0 4px rgba(212,175,55,0.4);
        }
        .divine-mercy-img {
            position: absolute;
            left: 50%;
            top: 210px;
            transform: translate(-50%, -50%);
            width: 125px;
            height: 185px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(212,175,55,0.25), 0 4px 15px rgba(0,0,0,0.8);
            border: 1px solid rgba(212,175,55,0.4);
            z-index: 1;
            pointer-events: none;
            background: #16161c;
        }
        .bead {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #444;
            border: 2px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
            transform: translate(-50%, -50%);
            z-index: 6;
        }
        .bead.cross { width:78px; height:78px; border-radius:12px; background:#5a4a3a; border-color:#8b7355; color:#e6c280; font-size:2.6rem; z-index:10; }
        .bead.blue-style { background:#2a4d69; border-color:#4b86b4; color:#adcbe3; font-size:0rem; }
        .bead.large-blue { width:36px; height:36px; }
        .bead.earlier-small-blue { width:16px; height:16px; }
        .bead.active { background:var(--p-gold)!important; border-color:#fff!important; color:#000!important; font-size:0.65rem; animation:pulse 0.8s infinite alternate; z-index:12; }
        @keyframes pulse {
            0% { transform:translate(-50%, -50%) scale(1); box-shadow:0 0 8px var(--glow); }
            100% { transform:translate(-50%, -50%) scale(1.3); box-shadow:0 0 25px var(--glow), 0 0 35px var(--p-gold); }
        }
        @media (max-width: 820px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
                gap: 8px;
                padding: 10px 12px 12px;
            }
            .left-pane { gap: 10px; height: auto; overflow: visible; }
            header { padding-top: 8px; }
            #display-panel {
                padding: 10px 12px;
                max-height: min(52dvh, 420px);
                flex: 0 1 auto;
                min-height: 0;
            }
            #prayer-text { font-size: clamp(0.95rem, 3.6vw, 1.12rem); }
            h1 { font-size: 1.05rem; text-align: center; }
            .controls {
                width: 100%;
                flex-wrap: nowrap;
                gap: 8px;
            }
            .controls button {
                flex: 1 1 0;
                min-width: 0;
                padding: 8px 6px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="left-pane">
        <header><h1 id="app-title">慈悲串經</h1></header>
        <div class="controls">
            <button id="start-btn">開始誦念</button>
            <button id="pause-btn" disabled>暫停</button>
            <button id="reset-btn">重設</button>
        </div>
        <div class="voice-settings">
            <div class="voice-row">
                <label for="lang-select" id="lang-label">語言：</label>
                <select id="lang-select">
                    <option value="zh-Hant-yue">廣東話 - 繁體中文</option>
                    <option value="zh-Hant">國語 - 繁體中文</option>
                    <option value="zh-Hans">普通话 - 简体中文</option>
                    <option value="en">English</option>
                </select>
                <label for="speed-select" id="speed-label">速度：</label>
                <select id="speed-select">
                    <option value="fastest">最快</option>
                    <option value="fast">快</option>
                    <option value="normal" selected>正常</option>
                    <option value="slow">慢</option>
                    <option value="slowest">最慢</option>
                </select>
            </div>
        </div>
        <div id="display-panel">
            <div id="prayer-progress" aria-hidden="true"></div>
            <h2 id="prayer-title">點擊「開始誦念」啟動全自動連續語音功能</h2>
            <p id="prayer-text">本系統支援中文語音朗誦（廣東話／國語／普通話），念珠會隨語音進度同步跳動發光。可在上方切換語言與語音。</p>
        </div>
    </aside>
    <section class="right-pane">
        <div class="rosary-stage" id="rosary-stage">
            <div class="rosary-layout-container" id="beads-container">
                <img class="divine-mercy-img" src="assets/Sacred.jpg?v=20260817" alt="Divine Mercy">
            </div>
        </div>
    </section>
</div>
<script>
const PRAYERS = {
    'zh-Hant': {
        s:{t:"因父、及子、及聖神之名",x:"因父、及子、及聖神之名。阿孟。"},
        p:{t:"天主經",x:"我們的天父，願祢的名受顯揚；願祢的國來臨；願祢的旨意奉行在人間，如同在天上。求祢今天賞給我們日用的食糧；求祢寬恕我們的罪過，如同我們寬恕別人一樣；不要讓我們陷於誘惑；但救我們免於凶惡。阿孟。"},
        m:{t:"聖母經",x:"萬福瑪利亞，妳充滿聖寵。主與妳同在。妳在婦女中受讚頌，妳的親子耶穌同受讚頌。天主聖母瑪利亞，求妳現在和我們臨終時，為我們罪人祈求天主。阿孟。"},
        c:{t:"宗徒信經",x:"我信全能的天主父，天地萬物的創造者。我信父的唯一子，我們的主耶穌基督。祂因聖神降孕，由童貞瑪利亞誕生。祂在比拉多執政時蒙難，被釘在十字架上，死而安葬。祂下降陰府，第三日自死者中復活。祂升了天，坐在全能天主父的右邊。祂要從天降來，審判生者死者。我信聖神。我信聖而公教會，諸聖的相通。罪過的赦免。肉身的復活。永恆的生命。阿孟。"},
        e:{t:"永生之父",x:"永生之父，我把您至愛之子，我們的主耶穌基督的聖體、聖血、靈魂及天主性奉獻給您，以賠補我們及普世的罪過。"},
        h:{t:"因祂的至悲慘苦難",x:"因祂的至悲慘苦難，求您垂憐我們及普世。"},
        g:{t:"至聖天主 (結尾三遍)",x:"至聖天主，至聖強有力者，致聖長存者，求您垂憐我們及普世。"},
        o:{t:"主耶穌，慈悲的君王，我們信賴祢！",x:"主耶穌，慈悲的君王，我們信賴祢！\n\n因父、及子及聖神之名。阿孟。"}
    },
    'zh-Hans': {
        s:{t:"因父、及子、及圣神之名",x:"因父、及子、及圣神之名。阿孟。"},
        p:{t:"天主经",x:"我们的天父，愿祢的名受显扬；愿祢的国来临；愿祢的旨意奉行在人间，如同在天上。求祢今天赏给我们日用的食粮；求祢宽恕我们的罪过，如同我们宽恕别人一样；不要让我们陷于诱惑；但救我们免于凶恶。阿孟。"},
        m:{t:"圣母经",x:"万福玛利亚，妳充满圣宠。主与妳同在。妳在妇女中受赞颂，妳的亲子耶稣同受赞颂。天主圣母玛利亚，求妳现在和我们临终时，为我们罪人祈求天主。阿孟。"},
        c:{t:"宗徒信经",x:"我信全能的天主父，天地万物的创造者。我信父的唯一子，我们的主耶稣基督。祂因圣神降孕，由童贞玛利亚诞生。祂在比拉多执政时蒙难，被钉在十字架上，死而安葬。祂下降阴府，第三日自死者中复活。祂升了天，坐在全能天主父的右边。祂要从天降来，审判生者死者。我信圣神。我信圣而公教会，诸圣的相通。罪过的赦免。肉身的复活。永恒的生命。阿孟。"},
        e:{t:"永生之父",x:"永生之父，我把您至爱之子，我们的主耶稣基督的圣体、圣血、灵魂及天主性奉献给您，以赔补我们及普世的罪过。"},
        h:{t:"因祂的至悲惨苦难",x:"因祂的至悲惨苦难，求您垂怜我们及普世。"},
        g:{t:"至圣天主 (结尾三遍)",x:"至圣天主，至圣强有力者，至圣长存者，求您垂怜我们及普世。"},
        o:{t:"主耶稣，慈悲的君王，我们信赖祢！",x:"主耶稣，慈悲的君王，我们信赖祢！\n\n因父、及子及圣神之名。阿孟。"}
    },
    en: {
        s:{t:"Sign of the Cross",x:"In the name of the Father, and of the Son, and of the Holy Spirit. Amen."},
        p:{t:"Our Father",x:"Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen."},
        m:{t:"Hail Mary",x:"Hail Mary, full of grace. The Lord is with thee. Blessed art thou among women, and blessed is the fruit of thy womb, Jesus. Holy Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen."},
        c:{t:"The Apostles' Creed",x:"I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; He descended into hell; on the third day He rose again from the dead; He ascended into heaven, and is seated at the right hand of God the Father almighty; from there He will come to judge the living and the dead. I believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen."},
        e:{t:"Eternal Father",x:"Eternal Father, I offer You the Body and Blood, Soul and Divinity of Your dearly beloved Son, Our Lord Jesus Christ, in atonement for our sins and those of the whole world."},
        h:{t:"For the sake of His sorrowful Passion",x:"For the sake of His sorrowful Passion, have mercy on us and on the whole world."},
        g:{t:"Holy God (three times)",x:"Holy God, Holy Mighty One, Holy Immortal One, have mercy on us and on the whole world."},
        o:{t:"Jesus, King of Mercy, we trust in You!",x:"Jesus, King of Mercy, we trust in You!\n\nIn the name of the Father, and of the Son, and of the Holy Spirit. Amen."}

};

const UI = {
    'zh-Hant': {
        htmlLang: 'zh-HK',
        bodyClass: '',
        title: '慈悲串經',
        start: '開始誦念',

        langLabel: '语言：',

        idleTitle: '点击「开始诵念」启动全自动连续语音功能',
        idleText: '本系统支持中文语音朗诵（广东话／国语／普通话）及英语，念珠会随语音进度同步跳动发光。可在上方切换语言。',

        decadeText: (n, x) => `(第 ${n} 端)\n${x}`,

    en: {

        start: 'Start',
        pause: 'Pause',
        resume: 'Resume',

        restart: 'Start Again',

        idleTitle: 'Tap “Start” for continuous voice guidance',
        idleText: 'This app supports Chinese (Cantonese / Mandarin) and English speech. The beads light up in sync with the prayer. Choose a language above.',

const LANG_ORDER = ['zh-Hant-yue', 'zh-Hant', 'zh-Hans', 'en'];
// Option labels stay in the language they represent (do not translate with UI).
const LANG_LABELS = {
    'zh-Hant-yue': '廣東話 - 繁體中文',
    'zh-Hant': '國語 - 繁體中文',
    'zh-Hans': '普通话 - 简体中文',

    'zh-Hant-yue': { ui: 'zh-Hant', prayers: 'zh-Hant', voice: 'yue' },
    'zh-Hant': { ui: 'zh-Hant', prayers: 'zh-Hant', voice: 'zh-TW' },
    'zh-Hans': { ui: 'zh-Hans', prayers: 'zh-Hans', voice: 'zh-CN' },
    en: { ui: 'en', prayers: 'en', voice: 'en' }
};

    yue: 'zh-Hant-yue',
    'zh-TW': 'zh-Hant',
    'zh-CN': 'zh-Hans',
    'zh-other': 'zh-Hant'
};

let seq = [];
let closingPrayers = [];
let idx = -1, playing = false, synth = window.speechSynthesis, utter = null, closingIdx = 0;
let preferredVoiceName = null;

const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-btn');
const resetBtn = document.getElementById('reset-btn');
const tDisp = document.getElementById('prayer-title');
const xDisp = document.getElementById('prayer-text');
const pDisp = document.getElementById('prayer-progress');
const box = document.getElementById('beads-container');

const sSel = document.getElementById('speed-select');

const speedLabel = document.getElementById('speed-label');
const LANG_PREF_KEY = 'pray-lang';
const VOICE_PREF_KEY = 'pray-voice';
const SPEED_PREF_KEY = 'pray-speed';
const SPEED_ORDER = ['fastest', 'fast', 'normal', 'slow', 'slowest'];
const SPEED_RATES = {
    fastest: 1.2,
    fast: 1.0,
    normal: 0.85,
    slow: 0.7,
    slowest: 0.55
};
const SPEED_PREF_VER_KEY = 'pray-speed-v';
const SPEED_PREF_VER = '3';

function currentLangKey() {
    return LANG_META[lSel.value] ? lSel.value : 'zh-Hant-yue';
}
function currentMeta() {
    return LANG_META[currentLangKey()];
}
function currentUI() {
    return UI[currentMeta().ui];
}
function currentPrayers() {
    return PRAYERS[currentMeta().prayers];
}

function buildSequence() {
    const P = currentPrayers();
    const ui = currentUI();
    seq = [];
    seq.push({id:0,type:"cross",title:P.s.t,text:P.s.x,label:"†"});
    seq.push({id:1,type:"blue-style earlier-small-blue",title:P.p.t,text:P.p.x,label:""});
    seq.push({id:2,type:"blue-style earlier-small-blue",title:P.m.t,text:P.m.x,label:""});
    seq.push({id:3,type:"blue-style earlier-small-blue",title:P.c.t,text:P.c.x,label:""});
    seq.push({id:4,type:"blue-style large-blue",title:ui.decadeTitle(1, P.e.t),text:ui.decadeText(1, P.e.x),label:""});
    for (let b = 0; b < 10; b++) {
        seq.push({id:seq.length,type:"small",title:P.h.t,text:P.h.x,progress:`${b + 1}/10`,label:(b + 1).toString()});
    }
    for (let d = 1; d < 5; d++) {
        seq.push({id:seq.length,type:"blue-style large-blue",title:ui.decadeTitle(d + 1, P.e.t),text:ui.decadeText(d + 1, P.e.x),label:""});
        for (let b = 0; b < 10; b++) {
            seq.push({id:seq.length,type:"small",title:P.h.t,text:P.h.x,progress:`${b + 1}/10`,label:(b + 1).toString()});
        }
    }
    closingPrayers = [
        {title:P.g.t, text:ui.passText(1, P.g.x)},
        {title:P.g.t, text:ui.passText(2, P.g.x)},
        {title:P.g.t, text:ui.passText(3, P.g.x)},
        {title:P.o.t, text:P.o.x}
    ];
}

function fitRosary(){
    if (!stage || !box) return;
    const pad = 16;
    const sw = stage.clientWidth - pad * 2;
    const sh = stage.clientHeight - pad * 2;
    if (sw <= 0 || sh <= 0) return;
    const layoutW = 480, layoutH = 680;
    const scale = Math.min(sw / layoutW, sh / layoutH);
    box.style.transform = `scale(${scale})`;
    const dx = (layoutW * scale - layoutW) / 2;
    const dy = (layoutH * scale - layoutH) / 2;
    box.style.margin = `${dy}px ${dx}px`;
}
function fitPrayerText(){
    if (!xDisp) return;
    xDisp.style.fontSize = '';
    const styles = getComputedStyle(xDisp);
    const maxPx = parseFloat(styles.fontSize);
    const minPx = 12;
    if (!maxPx || xDisp.clientHeight < 8) return;
    if (xDisp.scrollHeight <= xDisp.clientHeight + 1) return;
    let lo = minPx, hi = maxPx, best = minPx;
    for (let i = 0; i < 14; i++) {
        const mid = (lo + hi) / 2;
        xDisp.style.fontSize = mid + 'px';
        if (xDisp.scrollHeight <= xDisp.clientHeight + 1) {
            best = mid;
            lo = mid;
        } else {
            hi = mid;
        }
    }
    xDisp.style.fontSize = best + 'px';
}
function showPrayer(title, text, progress){
    tDisp.innerText = title;
    xDisp.innerText = text;
    if (pDisp) pDisp.textContent = progress || '';
    requestAnimationFrame(() => requestAnimationFrame(fitPrayerText));
}
function render(){
    const centerX = 240, centerY = 245;
    const ringRadiusX = 205, ringRadiusY = 165, ringSqueeze = 0.22;
    const largeBlueY = centerY + ringRadiusY * (1 - ringSqueeze);
    const crossY = 622;
    const rLarge = 18, rSmall = 8, rCross = 39;
    const radiiBetween = [
        rLarge + rSmall,
        rSmall + rSmall,
        rSmall + rSmall,
        rSmall + rCross
    ];
    const totalSpan = crossY - largeBlueY;
    const lineLen = (totalSpan - radiiBetween.reduce((a, b) => a + b, 0)) / radiiBetween.length;
    const credoY = largeBlueY + rLarge + lineLen + rSmall;
    const aveY = credoY + rSmall + lineLen + rSmall;
    const paterY = aveY + rSmall + lineLen + rSmall;
    const stemYs = [crossY, paterY, aveY, credoY, largeBlueY];

    box.innerHTML = `<img class="divine-mercy-img" src="assets/Sacred.jpg?v=20260817" alt="Divine Mercy">`;

    const stemRadii = [rCross, rSmall, rSmall, rSmall, rLarge];
    for (let s = 0; s < stemYs.length - 1; s++) {
        const topEdge = stemYs[s + 1] + stemRadii[s + 1];
        const line = document.createElement('div');
        line.className = 'rosary-line';
        line.style.top = `${topEdge}px`;
        line.style.height = `${lineLen}px`;
        box.appendChild(line);
    }

    seq.forEach((b,i)=>{
        const el=document.createElement('div'); el.className=`bead ${b.type}`; el.innerHTML=b.label; let posX = centerX, posY = crossY;
        if(i === 0) { posX = centerX; posY = crossY; }
        else if(i === 1) { posX = centerX; posY = paterY; }
        else if(i === 2) { posX = centerX; posY = aveY; }
        else if(i === 3) { posX = centerX; posY = credoY; }
        else {
            const ringIndex = i - 4;
            const totalRingBeads = seq.length - 4;
            const angle = (ringIndex / totalRingBeads) * 2 * Math.PI + Math.PI / 2;
            const radiusX = ringRadiusX * Math.cos(angle);
            const radiusY = ringRadiusY * Math.sin(angle) * (1 - ringSqueeze * Math.sin(angle));
            posX = centerX + radiusX;
            posY = centerY + radiusY;
        }
        el.style.left = `${posX}px`; el.style.top = `${posY}px`; el.onclick=()=>{ beginReadingFrom(i); }; box.appendChild(el);
    });
    fitRosary();
}
function update(){ document.querySelectorAll('.bead').forEach((b,i)=>{ if(i===idx){ b.classList.add('active'); }else b.className=`bead ${seq[i].type}`; }); }

function applyUI(showIdle) {
    const ui = currentUI();
    document.documentElement.lang = ui.htmlLang;
    document.body.classList.remove('lang-zh-Hans', 'lang-en');
    if (ui.bodyClass) document.body.classList.add(ui.bodyClass);
    document.title = ui.title;
    appTitle.textContent = ui.title;
    langLabel.textContent = ui.langLabel;
    speedLabel.textContent = ui.speedLabel;
    const prev = lSel.value;
    lSel.innerHTML = '';
    LANG_ORDER.forEach(k => {
        const o = document.createElement('option');
        o.value = k;
        o.textContent = LANG_LABELS[k];
        lSel.appendChild(o);
    });
    lSel.value = LANG_META[prev] ? prev : 'zh-Hant-yue';
    const prevSpeed = sSel.value;
    sSel.innerHTML = '';
    SPEED_ORDER.forEach(k => {
        const o = document.createElement('option');
        o.value = k;
        o.textContent = ui.speedOptions[k];
        sSel.appendChild(o);
    });
    sSel.value = SPEED_RATES[prevSpeed] != null ? prevSpeed : 'normal';
    resetBtn.innerText = ui.reset;
    if (showIdle || (idx === -1 && !playing)) {
        showPrayer(ui.idleTitle, ui.idleText);
    }
}

function refreshControlsForState() {
    const ui = currentUI();
    resetBtn.innerText = ui.reset;
    if (idx === -1 && !playing) {
        startBtn.innerText = ui.start;
        pauseBtn.innerText = ui.pause;
        showPrayer(ui.idleTitle, ui.idleText);
        return;
    }
    if (!playing && idx >= seq.length) {
        startBtn.innerText = ui.restart;
        pauseBtn.innerText = ui.pause;
        return;
    }
    if (playing) {
        startBtn.innerText = ui.start;
        pauseBtn.innerText = ui.pause;
    } else {
        startBtn.innerText = ui.start;
        pauseBtn.innerText = ui.resume;
    }
}

function classifyVoiceLang(v) {
    const lang = (v.lang || '').toLowerCase().replace(/_/g, '-');
    const name = (v.name || '').toLowerCase();
    const isYue = lang.includes('zh-hk') || lang.includes('yue') || name.includes('cantonese') || name.includes('hong kong') || name.includes('粵語') || name.includes('廣東') || name.includes('广东') || name.includes('sinji');
    if (isYue) return 'yue';
    if (lang.startsWith('zh-tw') || name.includes('taiwan') || name.includes('meijia') || name.includes('美佳')) return 'zh-TW';
    if (lang.startsWith('zh-cn') || lang === 'zh' || name.includes('chinese (china)') || name.includes('tingting') || name.includes('ting-ting') || name.includes('丽娜') || name.includes('婷婷')) return 'zh-CN';
    if (lang.startsWith('en')) return 'en';
    if (lang.startsWith('zh') || name.includes('chinese') || name.includes('mandarin') || name.includes('中文') || name.includes('國語') || name.includes('国语') || name.includes('普通话') || name.includes('普通話')) return 'zh-other';
    return null;
}
function scoreVoice(v, langKey) {
    const name = v.name || '';
    let score = 0;
    if (name.includes('Google')) score += 30;
    if (name.includes('Enhanced') || name.includes('Premium') || name.includes('Neural')) score += 20;
    if (langKey === 'yue' && (name.includes('Sinji') || name.includes('粵語') || name.includes('粤语'))) score += 10;
    if (langKey === 'en' && (name.includes('Samantha') || name.includes('Daniel') || name.includes('Karen') || name.includes('Moira'))) score += 8;
    if (v.localService) score += 5;
    return score;
}
function voicesForLang(langKey) {
    try {
        const voices = synth.getVoices();
        let list = voices.filter(v => classifyVoiceLang(v) === langKey);
        if (langKey === 'zh-TW' && list.length === 0) {
            list = voices.filter(v => classifyVoiceLang(v) === 'zh-other');
        }
        if (langKey === 'zh-CN' && list.length === 0) {
            list = voices.filter(v => ['zh-CN', 'zh-other', 'zh-TW'].includes(classifyVoiceLang(v)));
        }
        if (langKey === 'en' && list.length === 0) {
            list = voices.filter(v => (v.lang || '').toLowerCase().startsWith('en'));
        }
        return list.sort((a, b) => scoreVoice(b, langKey) - scoreVoice(a, langKey) || a.name.localeCompare(b.name));
    } catch (e) { return []; }
}
function getAssignedVoice() {
    try {
        const voices = synth.getVoices();
        const voiceKey = currentMeta().voice;
        if (preferredVoiceName) {
            const saved = voices.find(x => x.name === preferredVoiceName && classifyVoiceLang(x) === voiceKey);
            if (saved) return saved;
        }
        const list = voicesForLang(voiceKey);
        return list[0] || voices.find(v => classifyVoiceLang(v) === voiceKey) || null;
    } catch (e) { return null; }
}
function loadV() {
    try {
        const voices = synth.getVoices();
        if (!voices || voices.length === 0) return;
        const voiceKey = currentMeta().voice;
        const list = voicesForLang(voiceKey);
        const savedVoice = localStorage.getItem(VOICE_PREF_KEY);
        preferredVoiceName = list.find(x => x.name === savedVoice)?.name || list[0]?.name || null;
        if (preferredVoiceName) localStorage.setItem(VOICE_PREF_KEY, preferredVoiceName);
    } catch (e) {}
}
function migrateLangPref(saved) {
    if (!saved) return null;
    if (LANG_META[saved]) return saved;
    return OLD_LANG_MAP[saved] || null;
}
function initLangSelect() {
    const saved = migrateLangPref(localStorage.getItem(LANG_PREF_KEY));
    lSel.value = saved && LANG_META[saved] ? saved : 'zh-Hant-yue';
    localStorage.setItem(LANG_PREF_KEY, lSel.value);
}
function currentSpeechRate() {
    const key = SPEED_RATES[sSel.value] != null ? sSel.value : 'normal';
    return SPEED_RATES[key];
}
function migrateSpeedPref(saved) {
    let key = saved;
    const ver = parseInt(localStorage.getItem(SPEED_PREF_VER_KEY) || '0', 10);
    if (ver < 2) {
        // v1: current=mid(0.85), normal=1.0
        if (key === 'current') key = 'normal';
        else if (key === 'normal') key = 'faster';
    }
    if (ver < 3) {
        // v2 → v3 names; keep rates aligned with labels
        if (key === 'fast') key = 'fastest';
        else if (key === 'faster') key = 'fast';
        else if (key === 'slower') key = 'slow';
        else if (key === 'current') key = 'normal';
    }
    localStorage.setItem(SPEED_PREF_VER_KEY, SPEED_PREF_VER);
    return key && SPEED_RATES[key] != null ? key : null;
}
function initSpeedSelect() {
    const saved = migrateSpeedPref(localStorage.getItem(SPEED_PREF_KEY));
    sSel.value = saved || 'normal';
    localStorage.setItem(SPEED_PREF_KEY, sSel.value);
}
function isAppleChineseVoice(voiceObj) {
    const name = voiceObj ? (voiceObj.name || '') : '';
    if (name.includes('Sinji') || name.includes('Meijia') || name.includes('Tingting') || name.includes('Ting-Ting') || name.includes('Apple')) return true;
    return !name && /iPhone|iPad|Macintosh/i.test(navigator.userAgent);
}
function optimizeTextForVoice(rawText, voiceObj) {
    let clean = rawText
        .replace(/\(\d+\/\d+\)/g, '')
        .replace(/\(第\s*\d+\s*[端遍]\)/g, '')
        .replace(/\(Decade\s*\d+\)/gi, '')
        .replace(/\(\d+\s+of\s+3\)/gi, '');
    const voiceName = voiceObj ? voiceObj.name : '';
    const langKey = classifyVoiceLang(voiceObj) || currentMeta().voice;
    if (langKey === 'en') return clean.trim();
    clean = clean.replace(/妳的/g, '祢的').replace(/妳/g, '祢');
    if (langKey === 'yue') {
        // Force ming4 / mun4 (TTS often misreads 名 and 們)
        clean = clean.replace(/名/g, '明')
            .replace(/們/g, '門').replace(/们/g, '门')
            .replace(/阿孟/g, '阿門')
            .replace(/亞孟/g, '亞門').replace(/亚孟/g, '亚门');
        if (voiceName.includes('Google') || (preferredVoiceName || '').includes('Google')) {
            clean = clean.replace(/聖神/g, '聖臣').replace(/圣神/g, '圣臣')
                .replace(/垂憐/g, '誰憐').replace(/垂怜/g, '谁怜')
                .replace(/及普世/g, '同普世');
        }
    }
    return clean.trim();
}
function speakWithAssignedVoice(text, onDone) {
    loadV();
    const v = getAssignedVoice();
    const optimizedText = optimizeTextForVoice(text, v);
    utter = new SpeechSynthesisUtterance(optimizedText);
    const langFallback = { yue: 'zh-HK', 'zh-TW': 'zh-TW', 'zh-CN': 'zh-CN', en: 'en-US' };
    const voiceKey = currentMeta().voice;
    utter.lang = (v && v.lang) ? v.lang : (langFallback[voiceKey] || 'zh-HK');
    if (v) utter.voice = v;
    utter.rate = currentSpeechRate();
    utter.onend = () => { if (playing) onDone(); };
    utter.onerror = (e) => {
        if (!playing) return;
        if (e.error === 'interrupted' || e.error === 'canceled') return;
        setTimeout(() => { if (playing) onDone(); }, 400);
    };
    setTimeout(() => { if (playing) synth.speak(utter); }, 40);
}
function speak(){
    if (!playing || idx < 0) return;
    if (idx >= seq.length) { speakClosingSequence(); return; }
    synth.cancel();
    const b = seq[idx];
    showPrayer(b.title, b.text, b.progress);
    update();
    speakWithAssignedVoice(b.text, () => { idx++; setTimeout(speak, 150); });
}
function speakClosingSequence() {
    if (!playing) return;
    if (closingIdx >= closingPrayers.length) { endRosary(); return; }
    synth.cancel();
    const cp = closingPrayers[closingIdx];
    showPrayer(cp.title, cp.text);
    document.querySelectorAll('.bead').forEach(b => b.classList.remove('active'));
    speakWithAssignedVoice(cp.text, () => { closingIdx++; setTimeout(speakClosingSequence, 150); });
}
function endRosary() {
    playing = false;
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    startBtn.innerText = currentUI().restart;
    closingIdx = 0;
}
function jump(i){ idx=i; const b=seq[idx]; showPrayer(b.title, b.text, b.progress); update(); }
function beginReadingFrom(i){
    synth.cancel();
    closingIdx = 0;
    jump(i);
    playing = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    pauseBtn.innerText = currentUI().pause;
    speak();
}
function applyLanguage(showIdle) {
    buildSequence();
    render();
    applyUI(!!showIdle);
    refreshControlsForState();
    if (idx >= 0 && idx < seq.length) {
        showPrayer(seq[idx].title, seq[idx].text, seq[idx].progress);
        update();
    } else if (idx >= seq.length && closingIdx > 0 && closingIdx <= closingPrayers.length) {
        const cp = closingPrayers[Math.min(closingIdx, closingPrayers.length - 1)];
        showPrayer(cp.title, cp.text);
    }
    loadV();
}

startBtn.onclick=()=>{ if(!playing){ beginReadingFrom(idx===-1||idx>=seq.length ? 0 : idx); } };
pauseBtn.onclick=()=>{
    const ui = currentUI();
    if(playing){
        playing=false;
        synth.cancel();
        pauseBtn.innerText=ui.resume;
    } else {
        playing=true;
        pauseBtn.innerText=ui.pause;
        if(idx>=seq.length){ speakClosingSequence(); } else { speak(); }
    }
};
resetBtn.onclick=()=>{
    const ui = currentUI();
    playing=false;
    synth.cancel();
    idx=-1;
    closingIdx=0;
    startBtn.disabled=false;
    pauseBtn.disabled=true;
    startBtn.innerText=ui.start;
    pauseBtn.innerText=ui.pause;
    showPrayer(ui.idleTitle, ui.idleText);
    document.querySelectorAll('.bead').forEach(b=>{ b.className=`bead ${seq[b.id].type}`; });
};

lSel.onchange=()=>{
    localStorage.setItem(LANG_PREF_KEY, lSel.value);
    localStorage.removeItem(VOICE_PREF_KEY);
    preferredVoiceName = null;
    applyLanguage(idx === -1 && !playing);
    if (playing) { synth.cancel(); speak(); }
};
sSel.onchange=()=>{
    localStorage.setItem(SPEED_PREF_KEY, sSel.value);
    if (playing) { synth.cancel(); speak(); }
};

initLangSelect();
initSpeedSelect();
applyLanguage(true);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadV;
setTimeout(loadV, 300); setTimeout(loadV, 800);
window.addEventListener('resize', () => { fitRosary(); fitPrayerText(); });
</script>
