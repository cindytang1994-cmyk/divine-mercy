<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天主教慈悲串經諗珠 (無語音耶穌苦像版)</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.85)), 
                        url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #app-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .bead-image {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin: 15px 0;
            filter: drop-shadow(0px 5px 6px rgba(0,0,0,0.25));
        }
        .bounce {
            animation: jump 0.4s ease-out;
        }
        @keyframes jump {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        #prayer-text {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            min-height: 120px;
            margin: 20px 0;
            padding: 20px;
            border-left: 5px solid #d35400;
            background: #fdf2e9;
            border-radius: 4px;
            line-height: 1.6;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
            white-space: pre-line;
        }
        #counter {
            font-size: 16px;
            color: #7f8c8d;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            background-color: #d35400;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        button:hover {
            background-color: #e67e22;
            transform: translateY(-2px);
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id="app-container">
    <h2>慈悲串經諗珠 (靜音版)</h2>
    <div id="counter">第 1 / 57 步</div>
    <div><img id="bead-img" class="bead-image" src="" alt="諗珠"></div>
    <div id="prayer-text">載入中...</div>
    <div class="controls">
        <button id="prev-btn" onclick="changePrayer(-1)">上一步</button>
        <button id="next-btn" onclick="changePrayer(1)">下一粒諗珠</button>
    </div>
</div>

<script>
    const prayers = [];
    const urlCatholicCrucifix = "https://rawpixel.com";
    const urlLargeBead = "https://icons8.com";
    const urlSmallBead = "https://icons8.com";

    prayers.push({ type: 'cross', text: "因父、及子、及聖神之名。阿們。\n（開端祈禱：耶穌，你斷了氣，但為靈魂流出生命的源頭...）" });
    prayers.push({ type: 'small', text: "【天主經】\n我們的天父，願你的名受顯揚；願你的國來臨；願你的旨意奉行在人間，如同在天上。求你今天賞給我們日用的食糧；求你寬恕我們的罪過，如同我們寬恕別人一樣；不要讓我們陷於誘惑，但救我們免於凶惡。阿們。" });
    prayers.push({ type: 'small', text: "【聖母經】\n萬福瑪利亞，妳充滿聖寵！主與妳同在。妳在婦女中受讚頌，妳的胎子耶穌同受讚頌。天主聖母瑪利亞，求妳現在和我們臨終時，為我們罪人祈求天主。阿們。" });
    prayers.push({ type: 'small', text: "【信經】\n我信全能的天主父，天地萬物的創造者。我信父的唯一聖子，我們的主耶穌基督。祂因聖神降孕，由童貞瑪利亞誕生..." });

    for (let decade = 1; decade <= 5; decade++) {
        prayers.push({ type: 'large', text: `【第 ${decade} 端 · 大諗珠】\n永生之父，我把您至愛之子，我們的主耶穌基督的聖體、聖血、靈魂及神性奉獻給您，以賠補我們及全世界的罪過。` });
        for (let bead = 1; bead <= 10; bead++) {
            prayers.push({ type: 'small', text: `【第 ${decade} 端 · 小諗珠 第 ${bead} 粒】\n因祂的至慘苦難，求您垂憐我們及全世界。` });
        }
    }

    for (let i = 1; i <= 3; i++) {
        prayers.push({ type: 'small', text: `【結尾祈禱 ${i}/3】\n至聖天主，至聖強有力者，至聖長存者，求您垂憐我們及全世界。` });
    }

    let currentStep = 0;
    const imgElement = document.getElementById('bead-img');

    function updateUI() {
        const prayer = prayers[currentStep];
        document.getElementById('counter').innerText = `第 ${currentStep + 1} / ${prayers.length} 步`;
        document.getElementById('prayer-text').innerText = prayer.text;
        
        if (prayer.type === 'cross') {
            imgElement.src = urlCatholicCrucifix; // 第一步自動顯示天主教耶穌苦像
        } else if (prayer.type === 'large') {
            imgElement.src = urlLargeBead;
        } else {
            imgElement.src = urlSmallBead;
        }
        
        imgElement.classList.remove('bounce');
        void imgElement.offsetWidth; 
        imgElement.classList.add('bounce');

        document.getElementById('prev-btn').disabled = currentStep === 0;
    }

    function changePrayer(direction) {
        currentStep += direction;
        if (currentStep >= prayers.length) {
            alert("您已唸完一整個慈悲串經！結語：耶穌，我信賴您！");
            currentStep = 0;
        }
        updateUI();
    }

    updateUI();
</script>
</body>
</html>
